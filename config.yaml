# Video Game Sales Prediction MLOps Configuration

data:
  raw_path: data/raw/vgsales.csv
  new_data_path: data/raw/new_vgsales.csv
  processed_dir: data/processed
  target_column: Global_Sales
  id_column: Rank
  features:
    - Platform
    - Year
    - Genre
    - Publisher

split:
  test_size: 0.20
  random_state: 42

model:
  n_estimators: 100
  learning_rate: 0.1
  max_depth: 3
  random_state: 42

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: Video_Game_Sales_Prediction

registry:
  model_name: Video_Game_Sales_Production_Model
  decision_metric: r2

quality_gate:
  metric: r2
  minimum_value: 0.08

lab9:
  repetitions: 3

paths:
  preprocessor: models/preprocessor.pkl
  model: models/final_model.pkl
  evaluation_report: reports/evaluation_report.json
  quality_gate_report: reports/quality_gate_report.json
  failure_report: reports/failure_report.json
  lifecycle_report: reports/lifecycle_report.json
  inference_output: outputs/inference_predictions.csv
