name: Lab 9 - Failure Handling Tests

on:
  push:
    branches: [main, master]
    paths:
      - "src/mlops_pipeline/10_failure_injection.py"
      - ".github/workflows/lab9_failure_tests.yml"
  workflow_dispatch:

jobs:
  failure-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Pre-populate pipeline baseline
        run: python src/mlops_pipeline/vgsales_pipeline.py --force

      - name: Run Lab 9 Failure Injection Suite
        run: python src/mlops_pipeline/10_failure_injection.py

      - name: Upload Failure Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab9-failure-report-${{ github.run_number }}
          path: reports/failure_report.json
